[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolife-mle"
version = "0.1.0"
description = "Home/Office/POI inference from Microsoft GeoLife GPS trajectories"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "h3>=4.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "timezonefinder==9.0.0",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
dev = [
  "boto3>=1.35,<2",
  "moto[s3,sqs,dynamodb]>=5.0,<6",
  "jupyterlab>=4.2",
  "pytest>=8.3",
  "ruff>=0.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "shapely>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"geolife.api" = ["static/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
