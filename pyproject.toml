[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolife-mle"
version = "0.1.0"
description = "Home/Office/POI inference from Microsoft GeoLife GPS trajectories"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "h3>=4.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2",
  "pytest>=8.3",
  "ruff>=0.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
