name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check
      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q src notebooks/eda_core.py
      - name: Run tests
        run: pytest -q
      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          for path in [
              'notebooks/01_geolife_eda.ipynb',
              'notebooks/02_cleaning_staypoint_validation.ipynb',
              'notebooks/02b_staypoint_sensitivity_validation.ipynb',
              'notebooks/02c_same_second_transport_audit.ipynb',
              'notebooks/03_home_office_baseline.ipynb',
              'notebooks/04_api_contract_validation.ipynb',
              'notebooks/05_home_office_reliability_validation.ipynb',
              'notebooks/05b_home_consensus_adaptive_work.ipynb',
              'notebooks/05c_stable_secondary_independent_evidence.ipynb',
              'notebooks/06_routine_habit_mining.ipynb',
              'notebooks/06b_routine_representation_robustness.ipynb',
              'notebooks/06c_change_detection_representation_feasibility.ipynb',
              'notebooks/06d_support_indexed_window_feasibility.ipynb',
              'notebooks/07_work_regime_archetypes.ipynb',
              'notebooks/07b_factorized_work_profiles.ipynb',
              'notebooks/07c_external_poi_landuse_enrichment.ipynb',
          ]:
              json.load(open(path, encoding='utf-8'))
              print(path, 'json ok')
          PY
      - name: Import EDA helpers
        run: python -c "from notebooks.eda_core import read_plt, haversine_vectorized, inventory_dataset; print('eda helpers import ok')"
      - name: Import CP1 production APIs
        run: python -c "from geolife.staypoints import clean_trajectory, clean_trajectory_with_audit, detect_staypoints; print('staypoint APIs import ok')"

      - name: Import CP2 model APIs
        run: python -c "from geolife.model import HomeOfficeConfig, build_semantic_locations, infer_home_office; print('CP2 model APIs import ok')"

      - name: Import API contracts
        run: python -c "from geolife.api import app, ClassifyRequest, ClassifyResponse, InferRequest, InferResponse; print('API contracts import ok')"
