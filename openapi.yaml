openapi: 3.1.0
info:
  title: GeoLife Home / Office API
  description: "GeoLife location inference API. The mentor-facing v1 contract accepts raw GPS sequences at /v1/classify/{user_id}. Confidence values are heuristic evidence scores, not calibrated probabilities."
  version: 1.0.0
paths:
  /health:
    get:
      tags:
        - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/classify/{user_id}:
    post:
      tags:
        - inference
      summary: Classify a raw GPS sequence into HOME / OFFICE / POI locations
      operationId: classify_endpoint_v1_classify__user_id__post
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
            title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/home-office/infer:
    post:
      tags:
        - inference
      summary: Infer Home / Office evidence from one user's CP1 stay events
      operationId: infer_home_office_endpoint_v1_home_office_infer_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AbstainedResult:
      type: object
      additionalProperties: false
      required: [label, reason]
      properties:
        label:
          type: string
          enum: [HOME, OFFICE]
          title: Label
        status:
          type: string
          const: abstained
          default: abstained
          title: Status
        reason:
          $ref: '#/components/schemas/AbstentionReason'
      title: AbstainedResult
    AbstentionReason:
      type: string
      enum:
        - insufficient_stay_history
        - out_of_scope_geography
        - insufficient_recurring_history
        - insufficient_semantic_evidence
      title: AbstentionReason
    ClassificationAbstention:
      type: object
      additionalProperties: false
      required: [label, reason]
      properties:
        label:
          type: string
          enum: [HOME, OFFICE]
          title: Label
        reason:
          $ref: '#/components/schemas/AbstentionReason'
      title: ClassificationAbstention
    ClassifiedLocation:
      type: object
      additionalProperties: false
      required: [label, location_id, confidence, confidence_method]
      properties:
        label:
          type: string
          enum: [HOME, OFFICE, POI]
          title: Label
        location_id:
          type: integer
          minimum: 0
          title: Location Id
        confidence:
          type: number
          minimum: 0
          maximum: 1
          title: Confidence
        confidence_method:
          type: string
          enum: [home_office_evidence, poi_visit_share]
          title: Confidence Method
      title: ClassifiedLocation
    ClassifyRequest:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GpsPoint'
          title: Points
      title: ClassifyRequest
    ClassifyResponse:
      type: object
      additionalProperties: false
      required: [user_id, locations, abstentions]
      properties:
        user_id:
          type: string
          title: User Id
        api_version:
          type: string
          const: v1
          default: v1
          title: Api Version
        model_contract:
          type: string
          const: cp2-v1
          default: cp2-v1
          title: Model Contract
        locations:
          type: array
          items:
            $ref: '#/components/schemas/ClassifiedLocation'
          title: Locations
        abstentions:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationAbstention'
          title: Abstentions
      title: ClassifyResponse
    GpsPoint:
      type: object
      additionalProperties: false
      required: [timestamp_utc, latitude, longitude]
      properties:
        timestamp_utc:
          type: string
          format: date-time
          title: Timestamp Utc
        latitude:
          type: number
          minimum: -90
          maximum: 90
          title: Latitude
        longitude:
          type: number
          minimum: -180
          maximum: 180
          title: Longitude
      title: GpsPoint
    EmittedResult:
      type: object
      additionalProperties: false
      required:
        - label
        - location_id
        - evidence_strength
        - relevant_dwell_share
        - share_margin
        - relevant_dates
        - relevant_dwell_h
      properties:
        label:
          type: string
          enum: [HOME, OFFICE]
          title: Label
        status:
          type: string
          const: emitted
          default: emitted
          title: Status
        location_id:
          type: integer
          minimum: 0
          title: Location Id
        evidence_strength:
          type: number
          minimum: 0
          maximum: 1
          title: Evidence Strength
        relevant_dwell_share:
          type: number
          minimum: 0
          maximum: 1
          title: Relevant Dwell Share
        share_margin:
          type: number
          minimum: 0
          maximum: 1
          title: Share Margin
        relevant_dates:
          type: integer
          minimum: 0
          title: Relevant Dates
        relevant_dwell_h:
          type: number
          minimum: 0
          title: Relevant Dwell H
      title: EmittedResult
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
          default: ok
          title: Status
        service:
          type: string
          const: geolife-home-office-api
          default: geolife-home-office-api
          title: Service
        api_version:
          type: string
          const: v1
          default: v1
          title: Api Version
        model_contract:
          type: string
          const: cp2-v1
          default: cp2-v1
          title: Model Contract
      title: HealthResponse
    InferRequest:
      type: object
      additionalProperties: false
      required: [user_id, stays]
      properties:
        user_id:
          type: string
          minLength: 1
          maxLength: 256
          title: User Id
        stays:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StayEvent'
          title: Stays
      title: InferRequest
    InferResponse:
      type: object
      additionalProperties: false
      required: [user_id, results]
      properties:
        user_id:
          type: string
          title: User Id
        model_contract:
          type: string
          const: cp2-v1
          default: cp2-v1
          title: Model Contract
        results:
          type: array
          minItems: 2
          maxItems: 2
          items:
            oneOf:
              - $ref: '#/components/schemas/EmittedResult'
              - $ref: '#/components/schemas/AbstainedResult'
            discriminator:
              propertyName: status
              mapping:
                emitted: '#/components/schemas/EmittedResult'
                abstained: '#/components/schemas/AbstainedResult'
          title: Results
      title: InferResponse
    StayEvent:
      type: object
      additionalProperties: false
      required: [arrival_time_utc, departure_time_utc, latitude, longitude]
      properties:
        arrival_time_utc:
          type: string
          format: date-time
          title: Arrival Time Utc
        departure_time_utc:
          type: string
          format: date-time
          title: Departure Time Utc
        latitude:
          type: number
          minimum: -90
          maximum: 90
          title: Latitude
        longitude:
          type: number
          minimum: -180
          maximum: 180
          title: Longitude
      title: StayEvent
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
      title: HTTPValidationError
    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      title: ValidationError
